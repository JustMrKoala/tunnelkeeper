[workspace]
resolver = "3"
members = ["crates/core", "crates/tunnelkeeper", "crates/fake-cloudflare"]

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
